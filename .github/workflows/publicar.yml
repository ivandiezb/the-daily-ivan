# Publica en la web pública la edición que le manda la tarea diaria (scripts/publicar_github.py «edicion»):
# monta index.html con la plantilla actual y el JSON nuevo, actualiza el archivo, lo sube a main, pide a GitHub Pages
# que reconstruya la web y genera las imágenes y la cola de Instagram del día.
# La tarea diaria no sube archivos (su modo automático y el proxy de sus sesiones lo impiden a menudo): solo lanza
# este flujo con la edición comprimida (workflow_dispatch o repository_dispatch) o, como último recurso, sube una
# rama nueva «publicar-…» con la edición en entrada/.
name: Publicar edición

on:
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha de la edición (AAAA-MM-DD)"
        required: true
      edicion:
        description: "JSON de la edición, comprimido (xz + base64)"
        required: true
      ig:
        description: "Textos de Instagram, comprimidos (opcional)"
        required: false
        default: ""
      origen:
        description: "Quién lo lanza"
        required: false
        default: "manual"
  repository_dispatch:
    types: [publicar-edicion]
  push:
    branches: ["publicar-*"]

permissions:
  contents: write
  pages: write
  issues: write

concurrency:
  group: publicar-main
  cancel-in-progress: false

jobs:
  publicar:
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar el repositorio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone -q --filter=blob:none "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          git -C repo config user.name "github-actions[bot]"
          git -C repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Leer la edición recibida
        working-directory: repo
        env:
          FECHA: ${{ github.event.inputs.fecha || github.event.client_payload.fecha }}
          EDICION: ${{ github.event.inputs.edicion || github.event.client_payload.edicion }}
          IG: ${{ github.event.inputs.ig || github.event.client_payload.ig }}
          RAMA: ${{ github.ref_name }}
        run: |
          mkdir -p /tmp/entrada
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            git fetch -q origin "$RAMA"
            git show "origin/$RAMA:entrada/edicion.json" > /tmp/entrada/edicion.json
            git show "origin/$RAMA:entrada/ig.json" > /tmp/entrada/ig.json 2>/dev/null || rm -f /tmp/entrada/ig.json
            FECHA=$(python3 -c "import json; print(json.load(open('/tmp/entrada/edicion.json'))['fechaISO'])")
          else
            FECHA=$(python3 scripts/publicar_github.py desempaquetar --salida /tmp/entrada)
          fi
          if ! [[ "$FECHA" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "Fecha no válida: $FECHA"; exit 1; fi
          echo "FECHA=$FECHA" >> "$GITHUB_ENV"
          echo "Edición del $FECHA recibida por $GITHUB_EVENT_NAME"
          ls -la /tmp/entrada

      - name: Llevar la edición a main
        working-directory: repo
        run: |
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git checkout -q -B main origin/main
            TEXTO=$(python3 scripts/publicar_github.py montar --entrada /tmp/entrada --repo .)
            git add index.html .nojekyll archivo
            if git diff --cached --quiet; then echo "main ya tenía esta edición"; break; fi
            git commit -q -m "Edición del ${TEXTO,}"
            if git push -q origin HEAD:main; then echo "Publicada en main: $(git rev-parse --short HEAD)"; break; fi
            if [ "$i" -eq 5 ]; then echo "No se ha podido actualizar main"; exit 1; fi
            sleep $((i * 5))
          done
          echo "### Edición del $FECHA publicada (${GITHUB_EVENT_NAME})" >> "$GITHUB_STEP_SUMMARY"

      - name: Reconstruir GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" --jq '.status' || echo "Aviso: no se pudo pedir la reconstrucción; Pages la hará con el push"

      - name: Instagram (imágenes y cola del día)
        id: ig
        continue-on-error: true
        working-directory: repo
        run: |
          if [ ! -s /tmp/entrada/ig.json ]; then echo "Sin textos de Instagram: hoy no se programan publicaciones"; exit 0; fi
          python3 -m pip install -q playwright==1.56.0
          python3 -m playwright install --with-deps chromium > /tmp/playwright.log 2>&1 || { tail -20 /tmp/playwright.log; exit 1; }
          python3 scripts/instagram_tarjetas.py index.html --imagenes /tmp/ig_media --cola instagram --extra /tmp/entrada/ig.json
          RAMA_IMG="instagram-media-$FECHA"
          rm -rf /tmp/igm && mkdir /tmp/igm && cp -r "/tmp/ig_media/$FECHA" /tmp/igm/
          git -C /tmp/igm init -q -b "$RAMA_IMG"
          git -C /tmp/igm add .
          git -C /tmp/igm -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Imágenes de Instagram $FECHA"
          git -C /tmp/igm push -q -f "$(git remote get-url origin)" "$RAMA_IMG"
          git add "instagram/$FECHA/cola.json"
          if git diff --cached --quiet; then echo "La cola ya estaba"; exit 0; fi
          git commit -q -m "Instagram: cola del $FECHA"
          for i in 1 2 3 4; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then
              echo "Instagram: $(ls /tmp/ig_media/$FECHA | wc -l) imágenes en $RAMA_IMG y cola en main" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "No se ha podido guardar la cola"; exit 1

      - name: Borrar la rama de publicación
        if: success() && github.event_name == 'push'
        working-directory: repo
        env:
          RAMA: ${{ github.ref_name }}
        run: git push -q origin --delete "$RAMA" || true

      - name: Avisar si algo ha fallado
        if: failure() || steps.ig.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          IG_RESULTADO: ${{ steps.ig.outcome }}
        run: |
          URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$IG_RESULTADO" = "failure" ]; then QUE="las publicaciones de Instagram"; else QUE="la web"; fi
          TEXTO="Ha fallado la publicación de ${QUE} para la edición del ${FECHA:-?} (lanzada por ${GITHUB_EVENT_NAME}). Detalle: ${URL}"
          gh label create web --color D93F0B --description "Avisos de la web pública" -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          NUM=$(gh issue list -R "$GITHUB_REPOSITORY" --label web --state open --json number --jq '.[0].number')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" -R "$GITHUB_REPOSITORY" --body "$TEXTO"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --label web --title "Fallo al publicar" --body "$TEXTO"
          fi
