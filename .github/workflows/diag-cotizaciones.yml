# Temporal: compara la variación de CNBC con la calculada desde las barras de 5 días. Se borrará.
name: Diag cotizaciones
on: workflow_dispatch
jobs:
  probar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone -q --depth 1 -b datos "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" almacen
          python3 - <<'PY'
          import urllib.request, urllib.parse, json, time, datetime as dt
          from zoneinfo import ZoneInfo
          from concurrent.futures import ThreadPoolExecutor
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          def get(u):
              return json.loads(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA}), timeout=20).read())
          for rng in ("5D", "1D"):
              for s in ("TEF-ES", "NVDA"):
                  b = get(f"https://ts-api.cnbc.com/harmony/app/charts/{rng}.json?symbol={s}")["barData"]["priceBars"]
                  print("RANGO", rng, s, len(b), b[0]["tradeTime"], b[-1]["tradeTime"], "paso", (int(b[1]["tradeTimeinMills"]) - int(b[0]["tradeTimeinMills"])) // 60000, "min")
          uni = json.load(open("almacen/datos/valores/universo.json"))
          SUF = {".MC": "-ES", ".DE": "-DE", ".PA": "-FR", ".AS": "-NL", ".MI": "-IT", ".BR": "-BE", ".HE": "-FI", ".IR": "-IE"}
          def cn(t):
              for a, b in SUF.items():
                  if t.endswith(a): return t[:-len(a)] + b
              return t
          syms = [cn(x["tk"]) for k in ("ibex", "eurostoxx", "sp500") for x in uni[k]]
          syms = list(dict.fromkeys(syms))
          # cotizaciones oficiales (ahora, sin cambio de día)
          q = {}
          for i in range(0, len(syms), 40):
              p = syms[i:i+40]
              j = get("https://quote.cnbc.com/quote-html-webservice/restQuote/symbolType/symbol?symbols=" + urllib.parse.quote("|".join(p), safe="|.") + "&requestMethod=itv&noform=1&partnerId=2&fund=1&exthrs=1&output=json&events=1")
              for x in j["FormattedQuoteResult"]["FormattedQuote"]:
                  try: q[x["symbol"]] = (float(str(x["change_pct"]).replace("%","").replace("+","")), x.get("timeZone"))
                  except Exception: pass
              time.sleep(0.4)
          Z = {"CET": "Europe/Madrid", "EET": "Europe/Helsinki", "EST": "America/New_York", "GMT": "Europe/London"}
          SES = {"America/New_York": ("09:30", "16:00"), "Europe/Helsinki": ("10:00", "18:35")}
          def barras(s):
              try:
                  b = get(f"https://ts-api.cnbc.com/harmony/app/charts/5D.json?symbol={urllib.parse.quote(s)}")["barData"]["priceBars"]
                  return s, b, None
              except Exception as e:
                  return s, None, str(e)[:80]
          t0 = time.time(); res = {}; fallos = []
          with ThreadPoolExecutor(max_workers=8) as ex:
              for s, b, e in ex.map(barras, syms):
                  if b: res[s] = b
                  else: fallos.append((s, e))
          print(f"GRAFICAS {len(res)} de {len(syms)} en {time.time()-t0:.0f} s; fallos {len(fallos)} {fallos[:5]}")
          difs = []
          for s, b in res.items():
              if s not in q: continue
              z = ZoneInfo(Z.get(q[s][1], "Europe/Madrid")); ini, fin = SES.get(str(z), ("09:00", "17:40"))
              dias = {}
              for x in b:
                  t = dt.datetime.fromtimestamp(int(x["tradeTimeinMills"]) / 1000, z)
                  if ini <= t.strftime("%H:%M") <= fin:
                      dias.setdefault(t.date(), []).append(float(x["close"]))
              d = sorted(dias)
              if len(d) < 2: continue
              c = (dias[d[-1]][-1] / dias[d[-2]][-1] - 1) * 100
              difs.append((abs(c - q[s][0]), s, round(c, 2), q[s][0]))
          difs.sort(reverse=True)
          import statistics
          print("COMPARADOS", len(difs), "media", round(statistics.mean(x[0] for x in difs), 3), "p95", round(sorted(x[0] for x in difs)[int(len(difs)*.95)], 3))
          print("PEORES", difs[:12])
          PY
