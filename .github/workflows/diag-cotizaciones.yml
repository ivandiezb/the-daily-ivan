# Temporal: comprueba qué fuentes de cotizaciones responden desde GitHub Actions. Se borrará tras la prueba.
name: Diag cotizaciones
on: workflow_dispatch
jobs:
  probar:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, time, json
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          def get(u, h=None):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers=dict({"User-Agent": UA}, **(h or {}))), timeout=20)
                  b = r.read(); return r.status, b[:300].decode("utf-8", "replace").replace("\n", " | ")
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:160].decode("utf-8", "replace").replace("\n", " ")
              except Exception as e:
                  return "ERR", str(e)[:160]
          syms = "TEF-ES|MTS-ES|SAP-DE|MC-FR|ASML-NL|ENI-IT|ABI-BE|NOKIA-FI|RACE-IT|NVDA|BRK.B|GOOGL|.RUT|.IBEX|.SPX|.STOXX50E|.STOXX50|.IXIC|.DJI"
          u = "https://quote.cnbc.com/quote-html-webservice/restQuote/symbolType/symbol?symbols=" + urllib.request.quote(syms, safe="|.") + "&requestMethod=itv&noform=1&partnerId=2&fund=1&exthrs=1&output=json&events=1"
          s, b = get(u)
          r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA}), timeout=20)
          j = json.loads(r.read())
          qs = j["FormattedQuoteResult"]["FormattedQuote"]
          print("CAMPOS:", sorted(qs[0].keys()))
          for q in qs:
              print("Q", {k: q.get(k) for k in ("symbol","code","name","shortName","last","change","change_pct","previous_day_closing","last_time","exchange","currencyCode","curmktstatus","timeZone")})
          for sym in ("TEF-ES", ".RUT", "NVDA", "SAP-DE"):
              try:
                  r = urllib.request.urlopen(urllib.request.Request("https://ts-api.cnbc.com/harmony/app/charts/1D.json?symbol=" + urllib.request.quote(sym), headers={"User-Agent": UA}), timeout=20)
                  j = json.loads(r.read()); bars = (j.get("barData") or {}).get("priceBars") or []
                  print("CHART", sym, len(bars), bars[0]["tradeTime"] if bars else None, bars[-1]["tradeTime"] if bars else None, bars[-1]["close"] if bars else None, [k for k in j.keys()], [k for k in (j.get("barData") or {}).keys()])
              except Exception as e:
                  print("CHART", sym, "ERR", e)
              time.sleep(1)
          PY
