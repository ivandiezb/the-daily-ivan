# Recoge cada mañana titulares de muchos medios, fuentes oficiales y tendencias de búsqueda,
# y los guarda en datos/ para que la tarea diaria de The Daily Iván los use.
name: Fuentes

on:
  schedule:
    - cron: "5,35 6,7 * * *"
      timezone: "Europe/Madrid"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/recoger_fuentes.py
      - .github/workflows/fuentes.yml

permissions:
  contents: write

concurrency:
  group: fuentes
  cancel-in-progress: false

jobs:
  recoger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el repositorio
        env:
          GH_TOKEN: ${{ github.token }}
        run: git clone --depth 50 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Recoger titulares y tendencias
        working-directory: repo
        run: python3 scripts/recoger_fuentes.py

      - name: Guardar
        if: always()
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -q -m "Fuentes: titulares y tendencias $(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then exit 0; fi
            sleep $((i * 5))
          done
          echo "No se ha podido guardar"; exit 1
